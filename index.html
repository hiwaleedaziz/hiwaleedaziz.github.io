<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Waleed Aziz: Graphic Designer and Video Editor in Lahore, Pakistan. Motion graphics, video ads and social media design.">
<title>Waleed Aziz Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: the CV, turned into a website. White paper, deep forest panels with a lime glow, lime pill labels, rounded photo with gradient squares. */
:root{
  --paper:#F5F8F2; --card:#FFFFFF; --ink:#14201A; --muted:#5A6B60; --line:#DCE6D5;
  --forest:#0D3B24; --forest-2:#165432; --on-forest:#EEF5E8; --on-forest-muted:#B9CDBE;
  --lime:#C9E08F; --lime-strong:#8FBF45; --lime-ink:#0D3B24;
  --f:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:22px;
  --cta-fill:#0D3B24; --neon:#169A4C;
  --glass:rgba(255,255,255,.42); --glass-rim:rgba(255,255,255,.75); --glass-shade:rgba(13,59,36,.14); --glass-hi:rgba(255,255,255,.9);
  --blob-a:rgba(201,224,143,.55); --blob-b:rgba(70,170,120,.28); --blob-c:rgba(143,191,69,.30);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#06130C; --card:#0E2118; --ink:#E8F0E3; --muted:#9BAFA1; --line:#1D3527;
  --forest:#0E2E1E; --forest-2:#174A2E; --on-forest:#EEF5E8; --on-forest-muted:#A9C0B0;
  --lime:#C9E08F; --lime-strong:#B4D96A; --lime-ink:#0D3B24; color-scheme:dark;
  --neon:#2DCB6F; --cta-fill:#C9E08F; --glass:rgba(255,255,255,.06); --glass-rim:rgba(255,255,255,.18); --glass-shade:rgba(0,0,0,.45); --glass-hi:rgba(255,255,255,.35);
  --blob-a:rgba(180,217,106,.22); --blob-b:rgba(40,140,95,.30); --blob-c:rgba(23,90,60,.55)}}
:root[data-theme="dark"]{
  --paper:#06130C; --card:#0E2118; --ink:#E8F0E3; --muted:#9BAFA1; --line:#1D3527;
  --forest:#0E2E1E; --forest-2:#174A2E; --on-forest:#EEF5E8; --on-forest-muted:#A9C0B0;
  --lime:#C9E08F; --lime-strong:#B4D96A; --lime-ink:#0D3B24; color-scheme:dark;
  --neon:#2DCB6F; --cta-fill:#C9E08F; --glass:rgba(255,255,255,.06); --glass-rim:rgba(255,255,255,.18); --glass-shade:rgba(0,0,0,.45); --glass-hi:rgba(255,255,255,.35);
  --blob-a:rgba(180,217,106,.22); --blob-b:rgba(40,140,95,.30); --blob-c:rgba(23,90,60,.55)}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%;display:block}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--f);-webkit-font-smoothing:antialiased}
a{color:inherit}
b,strong{font-weight:700}
.wrap{max-width:1200px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
:focus-visible{outline:2px solid var(--lime-strong);outline-offset:3px}

.pill{display:inline-block;font:700 15px/1 var(--f);letter-spacing:.06em;text-transform:uppercase;padding:12px 20px;border-radius:999px}
.pill.dark{background:var(--forest);color:var(--on-forest)}
.pill.light{background:var(--card);color:var(--lime-ink);box-shadow:8px 0 0 -2px var(--lime),16px 0 0 -4px color-mix(in oklab,var(--lime) 40%,transparent)}
:root[data-theme="dark"] .pill.light{background:#F2F7EC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.light{background:#F2F7EC}}

.panel{position:relative;border-radius:36px;color:var(--on-forest);overflow:hidden;
  background:
    radial-gradient(60% 55% at 92% 0%,color-mix(in oklab,var(--lime) 45%,transparent),transparent 70%),
    radial-gradient(45% 40% at 20% 100%,color-mix(in oklab,var(--lime) 18%,transparent),transparent 70%),
    linear-gradient(160deg,var(--forest-2),var(--forest) 55%)}
.bullets{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.bullets li{position:relative;padding-left:24px;font-size:15px;line-height:1.5;color:var(--on-forest-muted)}
.bullets li::before{content:"";position:absolute;left:0;top:.38em;width:12px;height:12px;border-radius:3px;background:var(--lime)}

/* nav */
/* liquid glass */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(38% 32% at 88% 6%,var(--blob-a),transparent 70%),radial-gradient(34% 30% at 6% 42%,var(--blob-b),transparent 70%),radial-gradient(40% 34% at 70% 96%,var(--blob-c),transparent 70%)}
.glass{position:relative;background:linear-gradient(135deg,var(--glass-hi) -40%,transparent 38%),var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%) contrast(1.05);backdrop-filter:blur(22px) saturate(190%) contrast(1.05);border:1px solid var(--glass-rim);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 1px rgba(255,255,255,.08),inset 0 0 24px rgba(255,255,255,.06),0 12px 32px var(--glass-shade)}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:30;padding-inline:16px;margin-top:12px;pointer-events:none}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:7px 7px 7px 24px;max-width:1120px;border-radius:999px;pointer-events:auto}
.brand{white-space:nowrap;font:800 18px/1 var(--f);text-decoration:none;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--lime),#3D8A44)}
.nav ul{display:flex;align-items:center;gap:clamp(12px,2.6vw,26px);list-style:none;margin:0;padding:0}
.nav ul a{text-decoration:none;font-weight:600;font-size:14px;color:var(--muted)}
.nav ul a:hover{color:var(--ink)}

/* hero */
.hero{padding-block:clamp(40px,7vw,84px) 24px}
.hero-grid{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:clamp(32px,6vw,80px);align-items:center}
.photo-wrap{perspective:900px;padding:18px 20px 0 18px}
.photo{position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);will-change:transform;cursor:pointer}
.photo.live{transition:transform .08s linear}
.photo::before,.photo::after{content:"";position:absolute;border-radius:14px;background:linear-gradient(140deg,var(--lime),#3E8A45);box-shadow:0 10px 24px rgba(13,59,36,.25)}
.photo::before{top:-18px;left:-18px;width:74px;height:74px;transform:translateZ(-30px)}
.photo::after{right:-20px;bottom:36px;width:76px;height:72px;transform:translateZ(50px)}
.photo .pic{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:28px;overflow:hidden;background:var(--forest);color:var(--on-forest);display:grid;place-items:center;font:800 80px/1 var(--f);box-shadow:0 18px 40px rgba(13,59,36,.22);transition:box-shadow .3s}
.photo.live .pic{box-shadow:0 30px 60px rgba(13,59,36,.35)}
.photo .pic img{width:100%;height:100%;object-fit:cover}
.glare{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.35),transparent 55%)}
.photo.live .glare{opacity:1}
.hero h1{font:800 clamp(32px,3.6vw,46px)/1.05 var(--f);letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance;animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.role{font:600 clamp(16px,1.5vw,19px)/1.3 var(--f);margin:8px 0 24px;color:var(--muted)}
.role span{color:var(--lime-strong);padding-inline:6px}
.profile{font-size:clamp(16px,1.35vw,18px);line-height:1.65;margin:16px 0 0;max-width:62ch}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:999px;font:700 15px/1 var(--f);text-decoration:none;border:2px solid var(--forest);background:transparent;color:var(--ink);cursor:pointer}
:root[data-theme="dark"] .btn{border-color:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{border-color:var(--lime)}}
.btn.primary{background:var(--forest);color:var(--on-forest);border-color:var(--forest)}
:root[data-theme="dark"] .btn.primary{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}}
.btn:hover{transform:translateY(-1px)}
/* See my work: rainbow glow + page dims */
@property --spin{syntax:"<angle>";inherits:false;initial-value:0deg}
.cta-wrap{position:relative;z-index:1;display:inline-flex}
body.focus .cta-wrap{z-index:46}
.btn-hero{position:relative;transition:transform .45s cubic-bezier(.2,.8,.2,1),background .3s;border-width:2px}
.btn-hero::before,.btn-hero::after{content:"";position:absolute;border-radius:999px;z-index:-1;opacity:0;pointer-events:none;background:conic-gradient(from var(--spin),#ff2e63,#ff9f1c,#ffe14d,#5dff6a,#22e4ff,#4d6bff,#b44dff,#ff2e63);transition:opacity .45s ease;animation:spin 2.4s linear infinite}
.btn-hero::before{inset:-6px;filter:blur(10px)}
.btn-hero::after{inset:-22px;filter:blur(36px)}
:root .btn.primary.btn-hero:hover,:root .btn.primary.btn-hero:focus-visible{transform:scale(1.08);border-color:transparent;background:linear-gradient(var(--cta-fill),var(--cta-fill)) padding-box,conic-gradient(from var(--spin),#ff2e63,#ff9f1c,#ffe14d,#5dff6a,#22e4ff,#4d6bff,#b44dff,#ff2e63) border-box;animation:spin 2.4s linear infinite}
.btn-hero:hover::before,.btn-hero:focus-visible::before{opacity:1}
.btn-hero:hover::after,.btn-hero:focus-visible::after{opacity:.95}
@keyframes spin{to{--spin:360deg}}
.dim{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:0;transition:opacity .6s ease;background:radial-gradient(circle at var(--cx,50%) var(--cy,50%),transparent 0,rgba(2,8,5,.55) 180px,rgba(2,8,5,.86) 520px);-webkit-backdrop-filter:blur(3px) saturate(.6);backdrop-filter:blur(3px) saturate(.6)}
body.focus .dim{opacity:1}

.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.fact{padding:20px 22px;border-radius:22px}
.fact b{display:block;font:800 clamp(30px,3.6vw,44px)/1 var(--f);color:var(--forest)}
:root[data-theme="dark"] .fact b{color:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fact b{color:var(--lime)}}
.fact span{display:block;margin-top:6px;color:var(--muted);font-size:14px;font-weight:500}

/* sections */
section{padding-block:clamp(44px,6vw,80px)}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.sec-head h2{font:800 clamp(30px,4vw,46px)/1 var(--f);text-transform:uppercase;letter-spacing:.01em;margin:0}

/* work */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 14px/1 var(--f);padding:11px 16px;border-radius:999px;border:1px solid var(--glass-rim);background:linear-gradient(135deg,var(--glass-hi) -60%,transparent 45%),var(--glass);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 1px 0 var(--glass-hi),0 6px 18px var(--glass-shade);color:var(--ink);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip sup{font-size:11px;color:var(--muted);top:0}
.chip{transition:box-shadow .25s ease,background .25s ease,color .25s ease}
.chip[aria-pressed="true"]{background:var(--forest);color:var(--on-forest);border-color:var(--forest);box-shadow:0 0 0 3px color-mix(in oklab,var(--lime) 55%,transparent),0 0 22px 2px color-mix(in oklab,var(--lime-strong) 70%,transparent)}
.chip.bechip{--be:#1769FF;color:var(--be);border-color:color-mix(in oklab,var(--be) 55%,var(--line))}
.chip.bechip sup{color:color-mix(in oklab,var(--be) 70%,var(--muted))}
.chip.bechip[aria-pressed="true"]{background:var(--be);border-color:var(--be);color:#fff;box-shadow:0 0 0 3px color-mix(in oklab,var(--be) 35%,transparent),0 0 24px 2px color-mix(in oklab,var(--be) 75%,transparent)}
.chip.bechip[aria-pressed="true"] sup{color:#fff}
.chip[aria-pressed="true"] sup{color:var(--lime)}
.chip .be{font:900 13px/1 Arial,sans-serif;letter-spacing:-.04em}
.more{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px;border-radius:var(--r);background:var(--card);border:1.5px dashed color-mix(in oklab,var(--lime-strong) 60%,var(--line));text-decoration:none;aspect-ratio:404/316;max-width:100%}
.more b{font:800 22px/1.15 var(--f);text-transform:uppercase}
.more span{color:var(--muted);font-size:15px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:30px 22px;align-items:start}
.card{all:unset;box-sizing:border-box;display:block;width:100%;min-width:0;cursor:pointer}
.card:focus-visible{outline:2px solid var(--lime-strong);outline-offset:4px;border-radius:var(--r)}
.card.in{animation:pop .35s ease both}
.frame{position:relative;width:100%;max-width:100%;aspect-ratio:404/316;border-radius:var(--r);overflow:hidden;background:var(--forest);border:1px solid var(--line)}
.frame img{position:relative;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover .frame img{transform:scale(1.03)}
.play{position:absolute;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;z-index:2}
.play svg{width:16px;height:16px;margin-left:2px}
.meta{display:flex;justify-content:space-between;gap:12px;padding:12px 4px 0}
.meta h3{font:700 16px/1.3 var(--f);margin:0;min-width:0}
.meta p{margin:3px 0 0;color:var(--muted);font-size:14px}
.bebadge{position:absolute;top:12px;left:12px;z-index:2;font:900 12px/1 Arial,sans-serif;letter-spacing:-.03em;padding:7px 9px;border-radius:8px;background:#1769FF;color:#fff;box-shadow:0 4px 14px rgba(23,105,255,.35)}
.ratio{flex:none;font:700 11px/1 var(--f);letter-spacing:.06em;padding:6px 8px;border-radius:6px;background:color-mix(in oklab,var(--lime) 55%,var(--card));color:var(--lime-ink);height:max-content}

/* empty artboard shown until a Drive link is added */
.board{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:20px;color:var(--on-forest);
  background:radial-gradient(70% 60% at var(--gx,85%) 0%,color-mix(in oklab,var(--lime) var(--tint,35%),transparent),transparent 70%),linear-gradient(160deg,var(--forest-2),var(--forest))}
.board strong{font:800 clamp(22px,2.4vw,28px)/1.05 var(--f);text-transform:uppercase;max-width:14ch}
.board span{font:600 11px/1.4 var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}

/* experience */
.xp{padding:clamp(28px,5vw,64px)}
.xp .pill{display:table;margin:0 auto clamp(28px,4vw,44px)}
.jobs{display:grid;max-width:980px;margin:0 auto}
.job{display:grid;grid-template-columns:180px minmax(0,1fr);gap:clamp(18px,4vw,48px);padding-block:clamp(22px,3vw,32px);border-top:1px solid color-mix(in oklab,var(--on-forest) 16%,transparent)}
.job:first-child{border-top:0;padding-top:0}
.when{display:flex;flex-direction:column;align-items:flex-start;gap:10px;font:800 18px/1.2 var(--f);color:var(--lime);font-variant-numeric:tabular-nums}
.now{font:700 11px/1 var(--f);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:var(--lime);color:var(--lime-ink)}
.job h3{font:700 clamp(19px,2vw,23px)/1.25 var(--f);margin:0}
.job h3 small{font-weight:500;font-size:.8em}
.job .pos{font:700 16px/1.35 var(--f);margin:2px 0 14px}
.job .pos span{font-weight:500;color:var(--on-forest-muted)}
.below{margin-top:24px}
.skillset{padding:clamp(24px,4vw,48px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,4vw,56px)}
.skillset .pill{background:#F2F7EC;color:var(--lime-ink);margin-bottom:18px;text-transform:none;letter-spacing:0;font-size:17px}
.skillset ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px;font-weight:600;font-size:16px}
.skillset li{padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:linear-gradient(135deg,rgba(255,255,255,.22) -40%,transparent 45%),rgba(255,255,255,.07);-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 16px rgba(0,0,0,.18)}

/* contact */
.contact{padding:clamp(28px,5vw,64px)}
.contact h2{font:800 clamp(34px,6vw,72px)/1 var(--f);text-transform:uppercase;margin:16px 0 30px;text-wrap:balance;max-width:16ch}
.contact h2 span{color:var(--lime)}
.lines{display:grid;border-top:1px solid color-mix(in oklab,var(--on-forest) 18%,transparent)}
.line{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:16px;align-items:center;padding-block:18px;border-bottom:1px solid color-mix(in oklab,var(--on-forest) 18%,transparent)}
.line .k{font:700 12px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
.line a,.line output{font:700 clamp(17px,2.2vw,24px)/1.25 var(--f);text-decoration:none;overflow-wrap:anywhere}
.line a:hover{color:var(--lime)}
.copy{font:600 13px/1 var(--f);padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:linear-gradient(135deg,rgba(255,255,255,.25) -40%,transparent 45%),rgba(255,255,255,.08);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);color:var(--on-forest);cursor:pointer}
footer{margin-top:clamp(40px,6vw,72px);border-top:10px solid var(--forest);background:linear-gradient(160deg,var(--forest-2),var(--forest));color:var(--on-forest-muted);padding-block:26px;font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* viewer */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:min(1100px,calc(100vw - 32px));max-height:calc(100vh - 32px);border-radius:24px;overflow:hidden}
dialog::backdrop{background:rgba(4,16,9,.8)}
.vgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);max-height:calc(100vh - 32px)}
.vmedia{background:#000;display:grid;place-items:center;min-height:320px;position:relative}
.vmedia img{max-height:calc(100vh - 32px);width:auto;object-fit:contain}
.vmedia iframe{border:0;width:100%;aspect-ratio:var(--ar,9/16);max-height:calc(100vh - 32px)}
.vmedia .board{position:relative;width:100%;aspect-ratio:var(--ar,4/5);max-height:calc(100vh - 32px)}
.vinfo{padding:28px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.vinfo .pill{align-self:flex-start;font-size:12px;padding:9px 14px}
.vinfo h3{font:800 28px/1.1 var(--f);margin:0;text-transform:uppercase}
.vinfo dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:15px}
.vinfo dt{color:var(--muted)}
.vinfo dd{margin:0;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 13px/1 var(--f);padding:8px 12px;border-radius:999px;background:color-mix(in oklab,var(--lime) 45%,var(--card));color:var(--lime-ink)}
.vbar{display:flex;gap:8px;margin-top:auto;padding-top:12px;flex-wrap:wrap}
.x{position:absolute;top:10px;right:10px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:var(--lime);color:var(--lime-ink);font-size:22px;cursor:pointer}

@keyframes rise{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(10px) scale(.98)}to{transform:none}}
/* light sweep on hover: a soft white streak travels across cards and pills */
.sweep{position:absolute;inset:-1.5px;z-index:3;pointer-events:none;border-radius:inherit;overflow:hidden}
.sweep i{position:absolute;top:-10%;bottom:-10%;left:-30%;width:160%;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.15) 50%,transparent 70%);transform:translateX(-100%);transition:transform 1000ms ease}
.nav .wrap > .sweep i{left:0;width:100%;background:linear-gradient(to right,transparent,rgba(255,255,255,.15),transparent)}
.sweep-host:hover > .sweep i,.card:hover .frame > .sweep i,.sweep-host:focus-visible > .sweep i{transform:translateX(100%)}
@media (prefers-reduced-motion:reduce){.sweep{display:none}}

/* experience: closed by default, points slide down on hover with sparkles */
.job{position:relative;cursor:pointer;outline:none}
.job .jhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.job .jtog{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid color-mix(in oklab,var(--lime) 45%,transparent);color:var(--lime);font:600 18px/1 var(--f);transition:transform .45s cubic-bezier(.2,.8,.2,1),background .3s}
.job .jbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.2,.8,.2,1)}
.job .jbody > ul{overflow:hidden;min-height:0}
.job .jbody li{opacity:0;transform:translateY(-6px);transition:opacity .35s ease,transform .35s ease}
.job .pos{margin-bottom:0}
.job.open .jbody,.job:focus-visible .jbody{grid-template-rows:1fr}
.job.open .jbody > ul,.job:focus-visible .jbody > ul{padding-top:14px}
.job.open .jbody li,.job:focus-visible .jbody li{opacity:1;transform:none}
.job.open .jbody li:nth-child(2){transition-delay:.08s}
.job.open .jbody li:nth-child(3){transition-delay:.16s}
.job.open .jtog,.job:focus-visible .jtog{transform:rotate(45deg);background:color-mix(in oklab,var(--lime) 18%,transparent)}
@media (hover:hover) and (pointer:fine){
  .job:hover .jbody{grid-template-rows:1fr}
  .job:hover .jbody > ul{padding-top:14px}
  .job:hover .jbody li{opacity:1;transform:none}
  .job:hover .jbody li:nth-child(2){transition-delay:.08s}
  .job:hover .jbody li:nth-child(3){transition-delay:.16s}
  .job:hover .jtog{transform:rotate(45deg);background:color-mix(in oklab,var(--lime) 18%,transparent)}
}
.job .jbody > ul{transition:padding-top .55s cubic-bezier(.2,.8,.2,1)}
.spark{position:absolute;z-index:2;pointer-events:none;color:var(--lime);font-size:var(--s,12px);line-height:1;text-shadow:0 0 8px var(--lime);animation:spark .9s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}30%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0),var(--dy,-24px)) scale(1) rotate(90deg)}}

/* header Contact link: tube-light flicker with a soft green glow */
.nav a.neon{display:inline-flex;align-items:center;padding:9px 18px;border-radius:999px;color:var(--neon);border:1px solid rgba(45,203,111,.5);box-shadow:0 0 10px rgba(45,203,111,.3),inset 0 0 8px rgba(45,203,111,.15);transition:box-shadow .3s}
.nav a.neon:hover{color:var(--neon);box-shadow:0 0 16px rgba(45,203,111,.55),inset 0 0 10px rgba(45,203,111,.28)}
.nav a.neon .flick{text-shadow:0 0 6px rgba(45,203,111,.7),0 0 14px rgba(45,203,111,.35);animation:tube 6s infinite}
@keyframes tube{0%,6%,8.5%,11%,100%{opacity:1;text-shadow:0 0 6px rgba(45,203,111,.7),0 0 14px rgba(45,203,111,.35)}7%,10%{opacity:.3;text-shadow:none}9.5%{opacity:.8;text-shadow:0 0 4px rgba(45,203,111,.5)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

function ratio(f){ const [w,h] = String(f||"4:5").split(":").map(Number); return (w&&h) ? `${w}/${h}` : "4/5"; }
function driveId(u){ if(!u || !/^https?:/i.test(u)) return null; const m = u.match(/\/d\/([\w-]{10,})/) || u.match(/[?&]id=([\w-]{10,})/); return m ? m[1] : null; }
function ytId(u){ if(!u || !/^https?:/i.test(u)) return null; const m = u.match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/)([\w-]{11})/); return m ? m[1] : null; }
function img(u, w){ const id = driveId(u); return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w${w}` : u; }
function media(item){
  const u = (item.link||"").trim(); if(!u) return null;
  const yt = ytId(u);
  if (yt) return { thumb:`https://i.ytimg.com/vi/${yt}/hqdefault.jpg`, embed:`https://www.youtube-nocookie.com/embed/${yt}?autoplay=1&rel=0`, open:`https://youtu.be/${yt}`, video:true };
  const be = u.match(/behance\.net\/gallery\/(\d+)/);
  if (be) return { embed:`https://www.behance.net/embed/project/${be[1]}?ilo0=1`, open:u, behance:true };
  if (/behance\.net/i.test(u)) return { open:u, behance:true };
  const id = driveId(u);
  if (id) return { thumb:img(u,1200), full:img(u,2400), embed:`https://drive.google.com/file/d/${id}/preview`, open:`https://drive.google.com/file/d/${id}/view` };
  return { thumb:u, full:u, open:u };
}
function cover(item, m){ const c = (item.cover||"").trim(); return c ? img(c,1200) : (m && m.thumb); }

function wireCta(){

  const on = () => { const r = b.getBoundingClientRect(); dim.style.setProperty("--cx", `${r.left + r.width/2}px`); dim.style.setProperty("--cy", `${r.top + r.height/2}px`); document.body.classList.add("focus"); };
  const off = () => document.body.classList.remove("focus");
  b.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") on(); });
  b.addEventListener("pointerleave", off);
  b.addEventListener("focus", on); b.addEventListener("blur", off);
  b.addEventListener("click", off);

/* photo card: tilts toward the cursor and grows a little */
function wireTilt(){
  const el = $("#tilt");
  if (!matchMedia("(hover:hover) and (prefers-reduced-motion:no-preference)").matches) return;
  el.addEventListener("pointermove", e => {
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    el.classList.add("live");
    el.style.transform = `rotateX(${(-y*16).toFixed(2)}deg) rotateY(${(x*16).toFixed(2)}deg) scale(1.07)`;
    el.style.setProperty("--mx", `${(x+.5)*100}%`); el.style.setProperty("--my", `${(y+.5)*100}%`);
  });
  el.addEventListener("pointerleave", () => { el.classList.remove("live"); el.style.transform = ""; });
}

function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<t.length;i++){ const c=t[i];
    if (q){ if (c=='"'){ if (t[i+1]=='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if (c=='"') q=true; else if (c==','){ row.push(f); f=""; }
    else if (c=='\n'){ row.push(f); rows.push(row); row=[]; f=""; } else if (c!='\r') f+=c; }
  if (f || row.length){ row.push(f); rows.push(row); }
  const head = (rows.shift()||[]).map(s => s.trim().toLowerCase());
  return rows.filter(r => r.some(x => x.trim())).map(r => Object.fromEntries(head.map((k,i) => [k, (r[i]||"").trim()])));
}
function sortItems(list){
  return list.map(x => ({...x, featured: x.featured === true || /^(yes|true|1|y)$/i.test(String(x.featured||""))}))
    .sort((a,b) => (b.featured - a.featured) || ((+b.year||0) - (+a.year||0)));
}

  const cp = e.target.closest(".copy");
  if (cp){ const t = cp.dataset.copy;
    const done = () => { cp.textContent = "Copied"; setTimeout(()=>cp.textContent="Copy",1600); };
    const pick = () => { const r=document.createRange(); r.selectNodeContents(cp.previousElementSibling); getSelection().removeAllRanges(); getSelection().addRange(r); };
    try { navigator.clipboard.writeText(t).then(done, pick); } catch(_){ pick(); } }
});

function sparkle(job){

    s.style.left = `${30 + Math.random() * (box.width - 60)}px`;
    s.style.top = `${20 + Math.random() * Math.max(40, box.height - 30)}px`;

function wireJobs(){
  document.querySelectorAll(".job").forEach(job => {
    job.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") sparkle(job); });
    job.addEventListener("click", e => { if (e.pointerType === "mouse" && matchMedia("(hover:hover)").matches) return; job.classList.toggle("open"); if (job.classList.contains("open")) sparkle(job); });
    job.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); job.classList.toggle("open"); if (job.classList.contains("open")) sparkle(job); } });
  });
}

/* light sweep: add the streak layer to every card, pill and filter, including ones rendered later */
const SWEEP = ".frame,.fact,.more,.chip,.pill,.btn:not(.btn-hero),.tag,.skillset li,.ratio,.bebadge,.nav .wrap,.mnav a,.cchip,.wa-chip,.wa-btn,.wa-msg.bot";
function addSweep(el){
  if (el.querySelector(":scope > .sweep") || (el.closest("#experience,#contact") && !el.closest(".skillset"))) return;
  if (getComputedStyle(el).position === "static") el.style.position = "relative";
  el.classList.add("sweep-host");
  const s = document.createElement("span"); s.className = "sweep"; s.setAttribute("aria-hidden", "true"); s.innerHTML = "<i></i>";
  el.appendChild(s);
}
function sweepAll(root){ (root.matches?.(SWEEP) ? [root] : []).concat([...root.querySelectorAll?.(SWEEP) || []]).forEach(addSweep); }
new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1 && !n.classList.contains("sweep")) sweepAll(n); })))
  .observe(document.body, { childList:true, subtree:true });

fill();
if (SITE.showreel){
  const rb = $("#reelBtn"); rb.hidden = false;
  rb.onclick = () => { shown = [{ title:"Showreel", category:"Showreel", client:SITE.name, format:"16:9", link:SITE.showreel, type:"video", description:"A quick look at my motion, video and design work." }]; open(0); };
}
wireTilt();
wireCta();
/* phone menu: open/close the glass menu from the hamburger */
(() => {
  const nav = document.querySelector(".nav"), btn = nav.querySelector(".burger");
  const set = open => { nav.classList.toggle("menu-open", open); document.body.classList.toggle("menu-on", open); btn.setAttribute("aria-expanded", open); btn.setAttribute("aria-label", open ? "Close menu" : "Open menu"); };
  btn.addEventListener("click", () => set(!nav.classList.contains("menu-open")));
  nav.querySelectorAll(".mnav a").forEach(a => a.addEventListener("click", () => set(false)));
  document.querySelector(".menu-scrim").addEventListener("click", () => set(false));
  addEventListener("keydown", e => { if (e.key === "Escape") set(false); });
  addEventListener("resize", () => { if (innerWidth > 600) set(false); });
})();
$("#profMore").onclick = e => { const p = $("#profile"), open = p.classList.toggle("open"); e.target.textContent = open ? "Show less" : "Read more"; e.target.setAttribute("aria-expanded", open); };
sweepAll(document.body);
start(SITE.work);
if (SITE.sheetCsv){
  fetch(SITE.sheetCsv).then(r => r.ok ? r.text() : Promise.reject()).then(t => { const rows = parseCSV(t); if (rows.length) start(rows); }).catch(() => {});
}
