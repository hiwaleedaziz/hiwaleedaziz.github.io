<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Waleed Aziz: Graphic Designer and Video Editor in Lahore, Pakistan. Motion graphics, video ads and social media design.">
<title>Waleed Aziz Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: the CV, turned into a website. White paper, deep forest panels with a lime glow, lime pill labels, rounded photo with gradient squares. */
:root{
  --paper:#F5F8F2; --card:#FFFFFF; --ink:#14201A; --muted:#5A6B60; --line:#DCE6D5;
  --forest:#0D3B24; --forest-2:#165432; --on-forest:#EEF5E8; --on-forest-muted:#B9CDBE;
  --lime:#C9E08F; --lime-strong:#8FBF45; --lime-ink:#0D3B24;
  --f:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#06130C; --card:#0E2118; --ink:#E8F0E3; --muted:#9BAFA1; --line:#1D3527;
  --forest:#0E2E1E; --forest-2:#174A2E; --on-forest:#EEF5E8; --on-forest-muted:#A9C0B0;
  --lime:#C9E08F; --lime-strong:#B4D96A; --lime-ink:#0D3B24; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#06130C; --card:#0E2118; --ink:#E8F0E3; --muted:#9BAFA1; --line:#1D3527;
  --forest:#0E2E1E; --forest-2:#174A2E; --on-forest:#EEF5E8; --on-forest-muted:#A9C0B0;
  --lime:#C9E08F; --lime-strong:#B4D96A; --lime-ink:#0D3B24; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%;display:block}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--f);-webkit-font-smoothing:antialiased}
a{color:inherit}
b,strong{font-weight:700}
.wrap{max-width:1200px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
:focus-visible{outline:2px solid var(--lime-strong);outline-offset:3px}

.pill{display:inline-block;font:700 15px/1 var(--f);letter-spacing:.06em;text-transform:uppercase;padding:12px 20px;border-radius:999px}
.pill.dark{background:var(--forest);color:var(--on-forest)}
.pill.light{background:var(--card);color:var(--lime-ink);box-shadow:8px 0 0 -2px var(--lime),16px 0 0 -4px color-mix(in oklab,var(--lime) 40%,transparent)}
:root[data-theme="dark"] .pill.light{background:#F2F7EC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.light{background:#F2F7EC}}

.panel{position:relative;border-radius:36px;color:var(--on-forest);overflow:hidden;
  background:
    radial-gradient(60% 55% at 92% 0%,color-mix(in oklab,var(--lime) 45%,transparent),transparent 70%),
    radial-gradient(45% 40% at 20% 100%,color-mix(in oklab,var(--lime) 18%,transparent),transparent 70%),
    linear-gradient(160deg,var(--forest-2),var(--forest) 55%)}
.bullets{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.bullets li{position:relative;padding-left:24px;font-size:15px;line-height:1.5;color:var(--on-forest-muted)}
.bullets li::before{content:"";position:absolute;left:0;top:.38em;width:12px;height:12px;border-radius:3px;background:var(--lime)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in oklab,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{font:800 18px/1 var(--f);text-decoration:none;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--lime),#3D8A44)}
.nav ul{display:flex;gap:clamp(12px,2.6vw,26px);list-style:none;margin:0;padding:0}
.nav ul a{text-decoration:none;font-weight:600;font-size:14px;color:var(--muted)}
.nav ul a:hover{color:var(--ink)}

/* hero */
.hero{padding-block:clamp(40px,7vw,84px) 24px}
.hero-grid{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:clamp(32px,6vw,80px);align-items:center}
.photo-wrap{perspective:900px;padding:18px 20px 0 18px}
.photo{position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);will-change:transform;cursor:pointer}
.photo.live{transition:transform .08s linear}
.photo::before,.photo::after{content:"";position:absolute;border-radius:14px;background:linear-gradient(140deg,var(--lime),#3E8A45);box-shadow:0 10px 24px rgba(13,59,36,.25)}
.photo::before{top:-18px;left:-18px;width:74px;height:74px;transform:translateZ(-30px)}
.photo::after{right:-20px;bottom:36px;width:76px;height:72px;transform:translateZ(50px)}
.photo .pic{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:28px;overflow:hidden;background:var(--forest);color:var(--on-forest);display:grid;place-items:center;font:800 80px/1 var(--f);box-shadow:0 18px 40px rgba(13,59,36,.22);transition:box-shadow .3s}
.photo.live .pic{box-shadow:0 30px 60px rgba(13,59,36,.35)}
.photo .pic img{width:100%;height:100%;object-fit:cover}
.glare{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.35),transparent 55%)}
.photo.live .glare{opacity:1}
.hero h1{font:800 clamp(32px,3.6vw,46px)/1.05 var(--f);letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance;animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.role{font:600 clamp(16px,1.5vw,19px)/1.3 var(--f);margin:8px 0 24px;color:var(--muted)}
.role span{color:var(--lime-strong);padding-inline:6px}
.profile{font-size:clamp(16px,1.35vw,18px);line-height:1.65;margin:16px 0 0;max-width:62ch}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:999px;font:700 15px/1 var(--f);text-decoration:none;border:2px solid var(--forest);background:transparent;color:var(--ink);cursor:pointer}
:root[data-theme="dark"] .btn{border-color:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{border-color:var(--lime)}}
.btn.primary{background:var(--forest);color:var(--on-forest);border-color:var(--forest)}
:root[data-theme="dark"] .btn.primary{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}}
.btn:hover{transform:translateY(-1px)}

.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:clamp(36px,5vw,56px)}
.cchip{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;background:var(--card);border:1.5px solid color-mix(in oklab,var(--lime) 70%,var(--line));box-shadow:0 6px 16px rgba(13,59,36,.08);min-width:0;text-decoration:none}
.cchip .ic{flex:none;width:44px;height:44px;border-radius:10px;background:color-mix(in oklab,var(--lime) 70%,var(--card));display:grid;place-items:center;color:var(--lime-ink)}
.cchip .ic svg{width:22px;height:22px}
.cchip .txt{font-weight:500;font-size:16px;overflow-wrap:anywhere;min-width:0}
.secret{position:relative;display:inline-flex;flex-direction:column;gap:4px;cursor:help;border-radius:6px}
.secret .val{filter:blur(7px);transition:filter .5s ease;user-select:none}
.secret.on{cursor:auto}
.secret.on .val{filter:none;user-select:text}
.secret .hint{font:600 10px/1.2 var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.secret .bar{height:3px;border-radius:2px;background:color-mix(in oklab,var(--lime) 35%,transparent);overflow:hidden}
.secret .bar i{display:block;height:100%;width:0;background:var(--lime-strong)}
.secret.arming .bar i{width:100%;transition:width 3s linear}
.secret.on .hint,.secret.on .bar{display:none}
.lines .secret .hint{color:var(--on-forest-muted)}
.copy:disabled{opacity:.4;cursor:not-allowed}

.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.fact{padding:20px 22px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.fact b{display:block;font:800 clamp(30px,3.6vw,44px)/1 var(--f);color:var(--forest)}
:root[data-theme="dark"] .fact b{color:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fact b{color:var(--lime)}}
.fact span{display:block;margin-top:6px;color:var(--muted);font-size:14px;font-weight:500}

/* sections */
section{padding-block:clamp(44px,6vw,80px)}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.sec-head h2{font:800 clamp(30px,4vw,46px)/1 var(--f);text-transform:uppercase;letter-spacing:.01em;margin:0}

/* work */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 14px/1 var(--f);padding:11px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip sup{font-size:11px;color:var(--muted);top:0}
.chip{transition:box-shadow .25s ease,background .25s ease,color .25s ease}
.chip[aria-pressed="true"]{background:var(--forest);color:var(--on-forest);border-color:var(--forest);box-shadow:0 0 0 3px color-mix(in oklab,var(--lime) 55%,transparent),0 0 22px 2px color-mix(in oklab,var(--lime-strong) 70%,transparent)}
.chip.bechip{--be:#1769FF;color:var(--be);border-color:color-mix(in oklab,var(--be) 55%,var(--line))}
.chip.bechip sup{color:color-mix(in oklab,var(--be) 70%,var(--muted))}
.chip.bechip[aria-pressed="true"]{background:var(--be);border-color:var(--be);color:#fff;box-shadow:0 0 0 3px color-mix(in oklab,var(--be) 35%,transparent),0 0 24px 2px color-mix(in oklab,var(--be) 75%,transparent)}
.chip.bechip[aria-pressed="true"] sup{color:#fff}
.chip[aria-pressed="true"] sup{color:var(--lime)}
.chip .be{font:900 13px/1 Arial,sans-serif;letter-spacing:-.04em}
.more{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px;border-radius:var(--r);background:var(--card);border:1.5px dashed color-mix(in oklab,var(--lime-strong) 60%,var(--line));text-decoration:none;aspect-ratio:4/5;max-width:100%}
.more b{font:800 22px/1.15 var(--f);text-transform:uppercase}
.more span{color:var(--muted);font-size:15px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:30px 22px;align-items:start}
.card{all:unset;box-sizing:border-box;display:block;width:100%;min-width:0;cursor:pointer}
.card:focus-visible{outline:2px solid var(--lime-strong);outline-offset:4px;border-radius:var(--r)}
.card.in{animation:pop .35s ease both}
.frame{position:relative;width:100%;max-width:100%;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--forest);border:1px solid var(--line)}
.frame img{position:relative;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover .frame img{transform:scale(1.03)}
.play{position:absolute;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;z-index:2}
.play svg{width:16px;height:16px;margin-left:2px}
.meta{display:flex;justify-content:space-between;gap:12px;padding:12px 4px 0}
.meta h3{font:700 16px/1.3 var(--f);margin:0;min-width:0}
.meta p{margin:3px 0 0;color:var(--muted);font-size:14px}
.ratio{flex:none;font:700 11px/1 var(--f);letter-spacing:.06em;padding:6px 8px;border-radius:6px;background:color-mix(in oklab,var(--lime) 55%,var(--card));color:var(--lime-ink);height:max-content}

/* empty artboard shown until a Drive link is added */
.board{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:20px;color:var(--on-forest);
  background:radial-gradient(70% 60% at var(--gx,85%) 0%,color-mix(in oklab,var(--lime) var(--tint,35%),transparent),transparent 70%),linear-gradient(160deg,var(--forest-2),var(--forest))}
.board strong{font:800 clamp(22px,2.4vw,28px)/1.05 var(--f);text-transform:uppercase;max-width:14ch}
.board span{font:600 11px/1.4 var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}

/* experience */
.xp{padding:clamp(28px,5vw,64px)}
.xp .pill{display:table;margin:0 auto clamp(28px,4vw,44px)}
.jobs{display:grid;max-width:980px;margin:0 auto}
.job{display:grid;grid-template-columns:180px minmax(0,1fr);gap:clamp(18px,4vw,48px);padding-block:clamp(22px,3vw,32px);border-top:1px solid color-mix(in oklab,var(--on-forest) 16%,transparent)}
.job:first-child{border-top:0;padding-top:0}
.when{display:flex;flex-direction:column;align-items:flex-start;gap:10px;font:800 18px/1.2 var(--f);color:var(--lime);font-variant-numeric:tabular-nums}
.now{font:700 11px/1 var(--f);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:var(--lime);color:var(--lime-ink)}
.job h3{font:700 clamp(19px,2vw,23px)/1.25 var(--f);margin:0}
.job h3 small{font-weight:500;font-size:.8em}
.job .pos{font:700 16px/1.35 var(--f);margin:2px 0 14px}
.job .pos span{font-weight:500;color:var(--on-forest-muted)}
.below{margin-top:24px}
.skillset{padding:clamp(24px,4vw,48px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,4vw,56px)}
.skillset .pill{background:#F2F7EC;color:var(--lime-ink);margin-bottom:18px;text-transform:none;letter-spacing:0;font-size:17px}
.skillset ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px;font-weight:600;font-size:16px}
.skillset li{padding:10px 16px;border-radius:999px;border:1.5px solid color-mix(in oklab,var(--lime) 55%,transparent);background:color-mix(in oklab,var(--on-forest) 6%,transparent)}

/* contact */
.contact{padding:clamp(28px,5vw,64px)}
.contact h2{font:800 clamp(34px,6vw,72px)/1 var(--f);text-transform:uppercase;margin:16px 0 30px;text-wrap:balance;max-width:16ch}
.contact h2 span{color:var(--lime)}
.lines{display:grid;border-top:1px solid color-mix(in oklab,var(--on-forest) 18%,transparent)}
.line{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:16px;align-items:center;padding-block:18px;border-bottom:1px solid color-mix(in oklab,var(--on-forest) 18%,transparent)}
.line .k{font:700 12px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
.line a,.line output{font:700 clamp(17px,2.2vw,24px)/1.25 var(--f);text-decoration:none;overflow-wrap:anywhere}
.line a:hover{color:var(--lime)}
.copy{font:600 13px/1 var(--f);padding:9px 14px;border-radius:999px;border:1.5px solid var(--lime);background:transparent;color:var(--on-forest);cursor:pointer}
footer{margin-top:clamp(40px,6vw,72px);border-top:10px solid var(--forest);background:linear-gradient(160deg,var(--forest-2),var(--forest));color:var(--on-forest-muted);padding-block:26px;font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* viewer */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:min(1100px,calc(100vw - 32px));max-height:calc(100vh - 32px);border-radius:24px;overflow:hidden}
dialog::backdrop{background:rgba(4,16,9,.8)}
.vgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);max-height:calc(100vh - 32px)}
.vmedia{background:#000;display:grid;place-items:center;min-height:320px;position:relative}
.vmedia img{max-height:calc(100vh - 32px);width:auto;object-fit:contain}
.vmedia iframe{border:0;width:100%;aspect-ratio:var(--ar,9/16);max-height:calc(100vh - 32px)}
.vmedia .board{position:relative;width:100%;aspect-ratio:var(--ar,4/5);max-height:calc(100vh - 32px)}
.vinfo{padding:28px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.vinfo .pill{align-self:flex-start;font-size:12px;padding:9px 14px}
.vinfo h3{font:800 28px/1.1 var(--f);margin:0;text-transform:uppercase}
.vinfo dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:15px}
.vinfo dt{color:var(--muted)}
.vinfo dd{margin:0;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 13px/1 var(--f);padding:8px 12px;border-radius:999px;background:color-mix(in oklab,var(--lime) 45%,var(--card));color:var(--lime-ink)}
.vbar{display:flex;gap:8px;margin-top:auto;padding-top:12px;flex-wrap:wrap}
.x{position:absolute;top:10px;right:10px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:var(--lime);color:var(--lime-ink);font-size:22px;cursor:pointer}

@keyframes rise{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(10px) scale(.98)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

@media (max-width:880px){
  .hero-grid,.job,.skillset,.vgrid{grid-template-columns:minmax(0,1fr)}
  .job{gap:10px}
  .when{flex-direction:row;align-items:center}
  .photo-wrap{max-width:260px}
  .chips,.facts{grid-template-columns:minmax(0,1fr)}
  .line{grid-template-columns:minmax(0,1fr) auto}
  .line .k{grid-column:1/-1}
  .vinfo{padding:20px}
}
@media (max-width:480px){.nav ul li:first-child{display:none}.photo::after{right:-10px}}
</style>
</head>
<body>

<nav class="nav"><div class="wrap">
  <a class="brand" href="#top"><i></i><span id="brand"></span></a>
  <ul><li><a href="#work">Work</a></li><li><a href="#experience">Experience</a></li><li><a href="#skills">Skills</a></li><li><a href="#contact">Contact</a></li></ul>
</div></nav>

<main id="top">
  <header class="hero wrap">
    <div class="hero-grid">
      <div class="photo-wrap"><div class="photo" id="tilt"><div class="pic" id="pic"></div></div></div>
      <div>
        <h1 id="name"></h1>
        <p class="role" id="role"></p>
        <span class="pill dark">Profile</span>
        <p class="profile" id="profile"></p>
        <div class="ctas">
          <a class="btn primary" href="#work">See my work</a>
          <button class="btn" id="reelBtn" hidden><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg>Watch showreel</button>
          <a class="btn" id="cvTop" href="#" target="_blank" rel="noopener" hidden>Download CV</a>
        </div>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="facts" id="facts"></div>
  </header>

  <section id="work" class="wrap">
    <div class="sec-head">
      <h2>Selected work</h2>
      <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
    </div>
    <div class="wall" id="wall"></div>
  </section>

  <section id="experience" class="wrap">
    <div class="panel xp">
      <span class="pill light">Experience</span>
      <div class="jobs" id="jobs"></div>
    </div>
    <div class="below" id="skills">
      <div class="panel skillset">
        <div><span class="pill">Skills</span><ul id="skillList"></ul></div>
        <div><span class="pill">Software</span><ul id="softList"></ul></div>
      </div>
    </div>
  </section>

  <section id="contact" class="wrap">
    <div class="panel contact">
      <span class="pill light">Contact</span>
      <h2>Got a campaign? <span>Let's make it move.</span></h2>
      <div class="lines" id="lines"></div>
    </div>
  </section>
</main>
<footer><div class="wrap"><span id="foot"></span><a href="#top">Back to top ↑</a></div></footer>

<dialog id="viewer" aria-label="Project viewer">
  <button class="x" id="close" aria-label="Close">×</button>
  <div class="vgrid">
    <div class="vmedia" id="vmedia"></div>
    <div class="vinfo">
      <span class="pill dark" id="vcat"></span>
      <h3 id="vtitle"></h3>
      <p id="vdesc" style="margin:0;color:var(--muted)"></p>
      <dl id="vdl"></dl>
      <div class="tags" id="vtools"></div>
      <div class="vbar">
        <button class="btn" id="prev">← Prev</button>
        <button class="btn" id="next">Next →</button>
        <a class="btn primary" id="vopen" target="_blank" rel="noopener">Open original ↗</a>
      </div>
    </div>

  sheetCsv: "",

  // Your work. Replace the example pieces with your own and paste each Drive link into "link".
  // format: "1:1" square · "4:5" feed · "9:16" reel/story · "16:9" landscape · "1.91:1" link ad
  // featured: true puts a piece at the top. "cover" is an optional thumbnail image for videos.

  work: [
    { title: "Behance project title", category: "Behance", year: 2026, client: "", format: "4:5", link: "https://www.behance.net/Waleed_Aziz", cover: "", tools: "Photoshop",

    { title: "Prop firm promo video", category: "Video Ads", year: 2026, client: "SFX Funded", format: "9:16", link: "", cover: "", tools: "Premiere Pro, After Effects", featured: true,

const FORMAT_NAMES = {"1:1":"Square post","4:5":"Feed post","9:16":"Reel / Story","16:9":"Landscape video","1.91:1":"Link ad"};
const VIDEO_CATS = /video|motion|reel/i;
const ICONS = {
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>'
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function ratio(f){ const [w,h] = String(f||"4:5").split(":").map(Number); return (w&&h) ? `${w}/${h}` : "4/5"; }
function driveId(u){ if(!u || !/^https?:/i.test(u)) return null; const m = u.match(/\/d\/([\w-]{10,})/) || u.match(/[?&]id=([\w-]{10,})/); return m ? m[1] : null; }
function ytId(u){ if(!u || !/^https?:/i.test(u)) return null; const m = u.match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/)([\w-]{11})/); return m ? m[1] : null; }
function img(u, w){ const id = driveId(u); return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w${w}` : u; }
function media(item){
  const u = (item.link||"").trim(); if(!u) return null;
  const yt = ytId(u);
  if (yt) return { thumb:`https://i.ytimg.com/vi/${yt}/hqdefault.jpg`, embed:`https://www.youtube-nocookie.com/embed/${yt}?autoplay=1&rel=0`, open:`https://youtu.be/${yt}`, video:true };
  const be = u.match(/behance\.net\/gallery\/(\d+)/);
  if (be) return { embed:`https://www.behance.net/embed/project/${be[1]}?ilo0=1`, open:u, behance:true };
  if (/behance\.net/i.test(u)) return { open:u, behance:true };
  const id = driveId(u);
  if (id) return { thumb:img(u,1200), full:img(u,2400), embed:`https://drive.google.com/file/d/${id}/preview`, open:`https://drive.google.com/file/d/${id}/view` };
  return { thumb:u, full:u, open:u };
}
function cover(item, m){ const c = (item.cover||"").trim(); return c ? img(c,1200) : (m && m.thumb); }
function isVideo(item, m){ return (m && m.video) || /video/i.test(item.type||"") || VIDEO_CATS.test(item.category||""); }
function board(item, i){ return `<div class="board" style="--tint:${22 + (i*9)%30}%;--gx:${[85,20,60,95,40][i%5]}%"><span>${esc(item.format||"4:5")} · ${esc(FORMAT_NAMES[item.format]||"")}</span><strong>${esc(item.title)}</strong><span>${!item.link ? "Add your Drive link" : (/behance/i.test(item.link) && !item.cover ? "Add a cover image" : "Loading…")}</span></div>`; }
const playIcon = `<span class="play" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg></span>`;

let ITEMS = [], shown = [], active = "All", cur = 0;

function fill(){
  document.title = `${SITE.name} | ${SITE.role.join(" & ")}`;
  $("#brand").textContent = SITE.name;
  $("#name").textContent = SITE.name;
  $("#role").innerHTML = SITE.role.map(esc).join("<span>|</span>");
  $("#profile").innerHTML = SITE.profile;
  $("#foot").textContent = `© ${new Date().getFullYear()} ${SITE.name} · ${SITE.role.join(" & ")}`;
  const initials = SITE.name.split(/\s+/).map(p => p[0]).join("").slice(0,2).toUpperCase();
  $("#pic").innerHTML = (SITE.photo ? `<img alt="${esc(SITE.name)}" src="${esc(img(SITE.photo,900))}">` : initials) + `<span class="glare"></span>`;
  const pi = $("#pic img"); if (pi) pi.onerror = () => { $("#pic").textContent = initials; };
  if (SITE.cv){ const id = driveId(SITE.cv); const href = id ? `https://drive.google.com/file/d/${id}/view` : SITE.cv; const b = $("#cvTop"); b.href = href; b.hidden = false; }

  $("#chips").innerHTML = [
    [ICONS.pin, `<span class="txt">${esc(SITE.location)}</span>`, SITE.location],
    [ICONS.phone, `<span class="txt">${secretHTML("phone")}</span>`, SITE.phone],
    [ICONS.mail, `<span class="txt">${secretHTML("email")}</span>`, SITE.email]
  ].filter(c => c[2]).map(([ic,inner]) => `<div class="cchip"><span class="ic">${ic}</span>${inner}</div>`).join("");
  $("#facts").innerHTML = SITE.facts.map(([n,l]) => `<div class="fact"><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join("");

  const isNow = y => !y || /present|now|current/i.test(y);
  const yrs = y => (String(y).match(/\d{4}/g) || []).map(Number);
  const endY = y => isNow(y) ? 9999 : Math.max(0, ...yrs(y));
  const startY = y => yrs(y)[0] || 0;
  const jobs = [...SITE.experience].sort((a,b) => (endY(b.years) - endY(a.years)) || (startY(b.years) - startY(a.years)));
  $("#jobs").innerHTML = jobs.map(j => `<article class="job">
    <div class="when"><span>${esc(j.years || "Present")}</span>${isNow(j.years) ? `<span class="now">Current</span>` : ""}</div>
    <div><h3>${esc(j.company)}${j.note ? ` <small>(${esc(j.note)})</small>` : ""}</h3>
    <p class="pos">${esc(j.title)}</p>
    <ul class="bullets">${j.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div></article>`).join("");
  $("#skillList").innerHTML = SITE.skills.map(s => `<li>${esc(s)}</li>`).join("");
  $("#softList").innerHTML = SITE.software.map(s => `<li>${esc(s)}</li>`).join("");

  const rows = [];
  if (SITE.email) rows.push(`<div class="line"><span class="k">Email</span><output>${secretHTML("email")}</output><button class="copy" data-secret-copy="email" disabled>Copy</button></div>`);
  if (SITE.phone) rows.push(`<div class="line"><span class="k">${SITE.whatsapp ? "WhatsApp" : "Phone"}</span><output>${secretHTML("phone")}</output><button class="copy" data-secret-copy="phone" disabled>Copy</button></div>`);
  for (const s of SITE.socials) rows.push(`<div class="line"><span class="k">${esc(s.label)}</span><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url.replace(/^https?:\/\/(www\.)?/,""))}</a><span></span></div>`);
  $("#lines").innerHTML = rows.join("");
}

/* phone number and email: blurred until hovered (or held on touch) for 3 seconds */
const canHover = matchMedia("(hover:hover)").matches;
const FAKE = { phone:"+92 300 0000000", email:"name.surname@mail.com" };
function secretHTML(kind){
  return `<span class="secret" data-kind="${kind}" tabindex="0" aria-label="${kind === "phone" ? "Phone number" : "Email"} hidden. Hover for 3 seconds to reveal."><span class="val">${FAKE[kind]}</span><span class="bar"><i></i></span><span class="hint">${canHover ? "Hover 3s to reveal" : "Hold 3s to reveal"}</span></span>`;
}
const revealed = {};
function reveal(kind){
  if (revealed[kind]) return; revealed[kind] = true;
  const value = kind === "phone" ? SITE.phone : SITE.email;
  document.querySelectorAll(`.secret[data-kind="${kind}"]`).forEach(s => {
    s.classList.remove("arming"); s.classList.add("on"); s.removeAttribute("aria-label");
    s.querySelector(".val").innerHTML = (kind === "phone" && SITE.whatsapp)
      ? `<a href="https://wa.me/${esc(SITE.whatsapp)}" target="_blank" rel="noopener">${esc(value)}</a>` : esc(value);
  });
  document.querySelectorAll(`[data-secret-copy="${kind}"]`).forEach(b => { b.disabled = false; b.dataset.copy = value; });
}
function wireSecrets(){
  document.querySelectorAll(".secret").forEach(s => {
    const kind = s.dataset.kind; let t = null;
    const arm = () => { if (revealed[kind] || t) return; s.classList.add("arming"); t = setTimeout(() => reveal(kind), 3000); };
    const disarm = () => { if (revealed[kind]) return; clearTimeout(t); t = null; s.classList.remove("arming"); };
    s.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") arm(); });
    s.addEventListener("pointerleave", disarm);
    s.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") arm(); });
    s.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") disarm(); });
    s.addEventListener("pointercancel", disarm);
    s.addEventListener("contextmenu", e => { if (!revealed[kind]) e.preventDefault(); });
    s.addEventListener("focus", arm);
    s.addEventListener("blur", disarm);
  });
}

/* photo card: tilts toward the cursor and grows a little */
function wireTilt(){
  const el = $("#tilt");
  if (!matchMedia("(hover:hover) and (prefers-reduced-motion:no-preference)").matches) return;
  el.addEventListener("pointermove", e => {
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    el.classList.add("live");
    el.style.transform = `rotateX(${(-y*16).toFixed(2)}deg) rotateY(${(x*16).toFixed(2)}deg) scale(1.07)`;
    el.style.setProperty("--mx", `${(x+.5)*100}%`); el.style.setProperty("--my", `${(y+.5)*100}%`);
  });
  el.addEventListener("pointerleave", () => { el.classList.remove("live"); el.style.transform = ""; });
}

function renderFilters(){
  const cats = ["All", ...new Set(ITEMS.map(i => i.category).filter(Boolean))];
  $("#filters").innerHTML = cats.map(c => {
    const n = c === "All" ? ITEMS.length : ITEMS.filter(i => i.category === c).length;
    const label = c === "Behance" ? `<span class="be">Bē</span>Behance` : esc(c);
    return `<button class="chip${c === "Behance" ? " bechip" : ""}" aria-pressed="${c===active}" data-cat="${esc(c)}">${label}<sup>${n}</sup></button>`; }).join("");
}

function renderWall(){
  shown = ITEMS.filter(i => active === "All" || i.category === active);
  $("#wall").innerHTML = shown.map((it, i) => {
    const m = media(it), src = cover(it, m), vid = isVideo(it, m);
    return `<button class="card in" data-i="${i}" style="animation-delay:${Math.min(i,8)*40}ms">
      <div class="frame">
        ${board(it, i)}
        ${src ? `<img loading="lazy" alt="${esc(it.title)}" src="${esc(src)}" onerror="this.remove()">` : ""}
        ${vid ? playIcon : ""}
      </div>
      <div class="meta"><div><h3>${esc(it.title)}</h3><p>${esc(it.client)}${it.client && it.year ? " · " : ""}${esc(it.year)}</p></div>
      <span class="ratio">${esc(it.format||"4:5")}</span></div></button>`; }).join("")
    + (active === "Behance" && SITE.behance ? `<a class="more" href="${esc(SITE.behance)}" target="_blank" rel="noopener"><span class="be" style="font:900 34px/1 Arial,sans-serif">Bē</span><b>See all projects on Behance</b><span>Full case studies and process ↗</span></a>` : "");
}

function open(i){
  cur = (i + shown.length) % shown.length;
  const it = shown[cur], m = media(it), vid = isVideo(it, m), box = $("#vmedia");
  box.style.setProperty("--ar", ratio(it.format));
  if (m && m.behance){
    const c = cover(it, m);
    box.innerHTML = m.embed ? `<iframe src="${esc(m.embed)}" allowfullscreen title="${esc(it.title)}" style="aspect-ratio:auto;height:min(80vh,760px)"></iframe>` : (c ? `<img alt="${esc(it.title)}" src="${esc(c)}">` : board(it, cur));
  }
  else if (m && vid && m.embed) box.innerHTML = `<iframe src="${esc(m.embed)}" allow="autoplay; fullscreen" allowfullscreen title="${esc(it.title)}"></iframe>`;
  else if (m){ box.innerHTML = `<img alt="${esc(it.title)}" src="${esc(m.full || m.thumb)}">`; box.querySelector("img").onerror = () => { box.innerHTML = board(it, cur); }; }
  else box.innerHTML = board(it, cur);
  $("#vcat").textContent = it.category || "";
  $("#vtitle").textContent = it.title;
  $("#vdesc").textContent = it.description || "";
  $("#vdl").innerHTML = [["Client",it.client],["Year",it.year],["Format",it.format ? `${it.format} · ${FORMAT_NAMES[it.format]||""}` : ""]].filter(r=>r[1]).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
  $("#vtools").innerHTML = String(it.tools||"").split(",").map(s=>s.trim()).filter(Boolean).map(s=>`<span class="tag">${esc(s)}</span>`).join("");
  const o = $("#vopen"); if (m){ o.href = m.open; o.hidden = false; o.textContent = m.behance ? "View on Behance ↗" : "Open original ↗"; } else o.hidden = true;
  const d = $("#viewer"); if (!d.open) d.showModal();
}
function closeViewer(){ $("#vmedia").innerHTML = ""; $("#viewer").close(); }

function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<t.length;i++){ const c=t[i];
    if (q){ if (c=='"'){ if (t[i+1]=='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if (c=='"') q=true; else if (c==','){ row.push(f); f=""; }
    else if (c=='\n'){ row.push(f); rows.push(row); row=[]; f=""; } else if (c!='\r') f+=c; }
  if (f || row.length){ row.push(f); rows.push(row); }
  const head = (rows.shift()||[]).map(s => s.trim().toLowerCase());
  return rows.filter(r => r.some(x => x.trim())).map(r => Object.fromEntries(head.map((k,i) => [k, (r[i]||"").trim()])));
}
function sortItems(list){
  return list.map(x => ({...x, featured: x.featured === true || /^(yes|true|1|y)$/i.test(String(x.featured||""))}))
    .sort((a,b) => (b.featured - a.featured) || ((+b.year||0) - (+a.year||0)));
}
function start(list){ ITEMS = sortItems(list); renderFilters(); renderWall(); }

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip){ active = chip.dataset.cat; renderFilters(); renderWall(); return; }
  const card = e.target.closest(".card"); if (card){ open(+card.dataset.i); return; }
  const cp = e.target.closest(".copy");
  if (cp){ const t = cp.dataset.copy;
    const done = () => { cp.textContent = "Copied"; setTimeout(()=>cp.textContent="Copy",1600); };
    const pick = () => { const r=document.createRange(); r.selectNodeContents(cp.previousElementSibling); getSelection().removeAllRanges(); getSelection().addRange(r); };
    try { navigator.clipboard.writeText(t).then(done, pick); } catch(_){ pick(); } }
});
$("#close").onclick = closeViewer;
$("#prev").onclick = () => open(cur-1);
$("#next").onclick = () => open(cur+1);
$("#viewer").addEventListener("cancel", e => { e.preventDefault(); closeViewer(); });
$("#viewer").addEventListener("click", e => { if (e.target.id === "viewer") closeViewer(); });
document.addEventListener("keydown", e => { if (!$("#viewer").open) return; if (e.key==="ArrowRight") open(cur+1); if (e.key==="ArrowLeft") open(cur-1); });

fill();
if (SITE.showreel){
  const rb = $("#reelBtn"); rb.hidden = false;
  rb.onclick = () => { shown = [{ title:"Showreel", category:"Showreel", client:SITE.name, format:"16:9", link:SITE.showreel, type:"video", description:"A quick look at my motion, video and design work." }]; open(0); };
}
wireSecrets();
wireTilt();
start(SITE.work);
if (SITE.sheetCsv){
  fetch(SITE.sheetCsv).then(r => r.ok ? r.text() : Promise.reject()).then(t => { const rows = parseCSV(t); if (rows.length) start(rows); }).catch(() => {});
}
</script>
